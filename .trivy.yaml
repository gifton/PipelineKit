scanners:
  - vuln
  - secret
  - misconfig

# Not scanned: build output (.build, .swiftpm), .git, docs, Examples and Scripts.
# Everything else in the checkout is scanned, including the package manifest and
# lockfile, Sources, Tests and .github.
skip-dirs:
  - .build
  - .swiftpm
  - docs
  - .git
  - Examples
  - Scripts

timeout: 5m

vulnerability:
  # Report only high/critical by default; adjust in workflow if needed
  severity:
    - CRITICAL
    - HIGH
  ignore-unfixed: true
  types:
    - os
    - library

misconfiguration:
  severity:
    - CRITICAL
    - HIGH

secret:
  # Keep defaults; enable scanning
  enabled: true
