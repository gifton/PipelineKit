name: CI

# Runs on pushes to the branches listed below, on every pull request that targets
# main, develop or release/**, and on manual dispatch.

on:
  push:
    branches: [ main, develop, test-ci, 'release/**' ]
  pull_request:
    branches: [ main, develop, 'release/**' ]
  workflow_dispatch:

# Environment variables
env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  CI: 'true'
  MINIMUM_COVERAGE: 70  # Reported; enforced only when ENFORCE_COVERAGE is 'true'
  # These three checks report but do not fail their job; set a flag to 'true' to make it fail.
  ENFORCE_SWIFTLINT: 'false'
  ENFORCE_COVERAGE: 'false'
  ENFORCE_PERFORMANCE: 'false'

# Permissions
permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write
  actions: read

# Concurrency control
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Quick validation for every selected event, including release pushes
  quick-check:
    name: Quick Validation
    runs-on: ubuntu-latest  # Much faster queue times
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Swift CI Gates
        run: bash Scripts/ci/check-qualification-tools.sh
      
      - name: Check PR Size
        if: github.event_name == 'pull_request'
        run: |
          # Simple PR size check without complex processing
          git diff --stat origin/${{ github.base_ref }}...HEAD
          
          FILES_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | wc -l)
          echo "📊 Files changed: $FILES_CHANGED"
          
          if [ "$FILES_CHANGED" -gt 20 ]; then
            echo "⚠️ Large PR detected (>20 files). Consider breaking into smaller PRs."
          fi

  # SwiftLint - early fail job
  swiftlint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: |
          if which swiftlint >/dev/null; then
            swiftlint lint --strict --reporter json > swiftlint.json || true
            
            # Run SwiftLint and capture exit code
            swiftlint lint --strict || LINT_EXIT=$?
            
            # Conditional enforcement based on environment variable
            if [ "${{ env.ENFORCE_SWIFTLINT }}" = "true" ] && [ "${LINT_EXIT:-0}" -ne 0 ]; then
              echo "❌ SwiftLint violations found (enforcement enabled)"
              exit 1
            elif [ "${LINT_EXIT:-0}" -ne 0 ]; then
              echo "⚠️ SwiftLint violations found (enforcement disabled)"
            else
              echo "✅ SwiftLint passed"
            fi
          else
            echo "SwiftLint not installed, skipping..."
          fi
      
      - name: Upload SwiftLint Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swiftlint-results
          path: swiftlint.json
          if-no-files-found: ignore
          retention-days: 7

  # Main build job
  build:
    name: Build (macOS)
    runs-on: macos-26
    needs: swiftlint
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: System Info
      run: |
        echo "## System Info" >> $GITHUB_STEP_SUMMARY
        echo "- Swift: $(swift --version | head -1)" >> $GITHUB_STEP_SUMMARY
        echo "- Xcode: $(xcodebuild -version | head -1)" >> $GITHUB_STEP_SUMMARY
        echo "- macOS: $(sw_vers -productVersion)" >> $GITHUB_STEP_SUMMARY

    - name: Cache SPM
      uses: actions/cache@v6
      with:
        path: |
          .build
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Build Debug
      run: swift build --configuration debug

    - name: Build Release
      run: swift build --configuration release

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-macOS
        path: .build/release/
        retention-days: 7

  # Linux build job
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    needs: swiftlint
    timeout-minutes: 15
    continue-on-error: true  # Linux is advisory (see docs/platform-support.md)

    steps:
    - uses: actions/checkout@v7

    - name: Install Dependencies
      run: |
        apt-get update && apt-get install -y \
          libssl-dev \
          libcurl4-openssl-dev \
          libxml2-dev \
          tzdata \
          git \
          jq

    - name: Swift Version
      run: swift --version

    - name: Build Debug
      run: swift build --configuration debug

    - name: Build Release
      run: swift build --configuration release

  # Test job with coverage
  test:
    name: Test (macOS)
    runs-on: macos-26
    needs: [build, build-linux]
    timeout-minutes: 45  # Increased for individual target coverage collection
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Cache SPM
      uses: actions/cache@v6
      with:
        path: |
          .build
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: List Test Targets
      run: |
        echo "Available test targets:"
        swift test list

    - name: Run Tests
      run: |
        python3 Scripts/ci/coverage.py collect \
          --directory "${RUNNER_TEMP}/coverage-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

    - name: Generate Coverage Report
      id: coverage_report
      run: |
        python3 Scripts/ci/coverage.py export \
          --directory "${RUNNER_TEMP}/coverage-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          --output coverage.lcov

    - name: Upload Coverage Artifact
      uses: actions/upload-artifact@v7
      with:
        name: coverage-ci-macos
        path: coverage.lcov
        if-no-files-found: error

    - name: Check Coverage Threshold
      id: coverage_check
      run: |
        # Extract coverage percentage from lcov report
        if [ -f coverage.lcov ]; then
          TOTAL_LINES=$(grep -o 'LF:[0-9]*' coverage.lcov | awk -F: '{sum+=$2} END {print sum}')
          HIT_LINES=$(grep -o 'LH:[0-9]*' coverage.lcov | awk -F: '{sum+=$2} END {print sum}')
          
          if [ "$TOTAL_LINES" -gt 0 ]; then
            COVERAGE=$((HIT_LINES * 100 / TOTAL_LINES))
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
            
            # Check against threshold
            if [ "$COVERAGE" -lt "${{ env.MINIMUM_COVERAGE }}" ]; then
              if [ "${{ env.ENFORCE_COVERAGE }}" = "true" ]; then
                echo "❌ Coverage ${COVERAGE}% is below threshold of ${{ env.MINIMUM_COVERAGE }}% (enforcement enabled)"
                exit 1
              else
                echo "⚠️ Coverage ${COVERAGE}% is below threshold of ${{ env.MINIMUM_COVERAGE }}% (enforcement disabled)"
              fi
            else
              echo "✅ Coverage ${COVERAGE}% meets threshold of ${{ env.MINIMUM_COVERAGE }}%"
            fi
          else
            echo "⚠️ Could not calculate coverage"
          fi
        else
          echo "⚠️ Coverage report not found"
        fi
    
  # Linux secondary build job (build-only)
  test-linux:
    name: Build (Linux - extra)
    runs-on: ubuntu-latest
    container: swift:6.2
    needs: [build, build-linux]
    timeout-minutes: 20
    continue-on-error: true  # Linux is advisory (see docs/platform-support.md)

    steps:
    - uses: actions/checkout@v7

    - name: Install Dependencies
      run: |
        apt-get update && apt-get install -y \
          libssl-dev \
          libcurl4-openssl-dev \
          libxml2-dev \
          tzdata \
          git

    - name: Build Debug
      run: swift build --configuration debug

    - name: Build Release
      run: swift build --configuration release

  # Stress/Resilience tests
  stress-test:
    name: Stress Tests
    runs-on: macos-26
    needs: swiftlint  # Don't depend on test to avoid cascade failures
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Cache SPM
      uses: actions/cache@v6
      with:
        path: |
          .build
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Run Stress Tests
      run: |
        swift build --build-tests
        # The shared runner rejects empty discovery and preserves Swift's verdict.
        bash Scripts/run-tests.sh --target PipelineKitResilience --verbose

  # Performance tests
  performance:
    name: Performance Tests
    runs-on: macos-26
    needs: swiftlint  # Don't depend on build to avoid cascade failures
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v7

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Cache SPM
      uses: actions/cache@v6
      with:
        path: |
          .build
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Build Performance Tests
      # swift test needs every test target, even with a performance-only filter.
      # Keep compilation failures outside the advisory benchmark-result step.
      run: swift build --configuration release --build-tests -Xswiftc -enable-testing

    - name: Run Performance Tests
      run: |
        # Run XCTest performance tests in release mode
        swift test --configuration release --skip-build --filter "PipelineKitPerformanceTests" || PERF_EXIT=$?

        # Conditional enforcement based on environment variable
        if [ "${{ env.ENFORCE_PERFORMANCE }}" = "true" ] && [ "${PERF_EXIT:-0}" -ne 0 ]; then
          echo "❌ Performance tests failed (enforcement enabled)"
          exit 1
        elif [ "${PERF_EXIT:-0}" -ne 0 ]; then
          echo "⚠️ Performance tests failed (enforcement disabled)"
        else
          echo "✅ Performance tests passed"
        fi

    - name: Upload Performance Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: performance-test-results
        path: |
          .build/release/
        if-no-files-found: ignore
        retention-days: 7

  # Security scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write

    steps:
    - uses: actions/checkout@v7

    - name: Run Trivy Security Scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        severity: 'CRITICAL,HIGH'
        format: 'sarif'
        output: 'trivy-results.sarif'
        exit-code: '1'
        trivy-config: .trivy.yaml
        token-setup-trivy: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Trivy Results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Documentation generation and deployment
  documentation:
    name: Documentation
    runs-on: macos-26
    needs: swiftlint  # Don't depend on build to avoid cascade failures
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - uses: actions/checkout@v7

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Cache SPM
      uses: actions/cache@v6
      with:
        path: |
          .build
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-spm-docs-${{ hashFiles('Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-docs-
          ${{ runner.os }}-spm-

    - name: Build Documentation Site
      run: Scripts/build-docs-site.sh ./docs-site

    - name: Check Documentation Coverage
      run: Scripts/check-doc-coverage.sh

    - name: Setup Pages
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/configure-pages@v6

    - name: Upload to GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./docs-site

    - name: Deploy to GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: deployment
      uses: actions/deploy-pages@v5

  # Final status check
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [build, build-linux, test, test-linux, swiftlint, stress-test, performance, security, documentation]
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check Status
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SWIFTLINT_RESULT: ${{ needs.swiftlint.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          BUILD_LINUX_RESULT: ${{ needs.build-linux.result }}
          TEST_LINUX_RESULT: ${{ needs.test-linux.result }}
        run: bash Scripts/ci/check-required-status.sh
