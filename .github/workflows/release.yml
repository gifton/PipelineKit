name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CI: 'true'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel releases

jobs:
  validate-tag:
    name: Validate Tag and Release Notes
    runs-on: macos-26
    outputs:
      version: ${{ steps.notes.outputs.version }}
      prerelease: ${{ steps.notes.outputs.prerelease }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}

    - name: Validate exact changelog section
      id: notes
      run: |
        python3 Scripts/ci/release_notes.py --tag "${GITHUB_REF#refs/tags/}" \
          --output release-notes.md --github-output "$GITHUB_OUTPUT"

  qualification:
    name: Qualify Tagged Commit
    needs: validate-tag
    uses: ./.github/workflows/ci-multiplatform.yml

  build-docs:
    name: Build Documentation
    needs: validate-tag
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}

    - name: Select documentation toolchain
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0.1'

    - name: Build documentation
      run: Scripts/build-docs-site.sh ./docs-site

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./docs-site

  create-release:
    name: Create Release
    needs: [validate-tag, qualification, build-docs]
    runs-on: macos-26
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}

    - name: Extract validated release notes
      run: |
        python3 Scripts/ci/release_notes.py --tag "${GITHUB_REF#refs/tags/}" \
          --output release-notes.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ needs.validate-tag.outputs.version }}
        target_commitish: ${{ github.sha }}
        name: v${{ needs.validate-tag.outputs.version }}
        body_path: release-notes.md
        draft: false
        prerelease: ${{ needs.validate-tag.outputs.prerelease == 'true' }}

  publish-docs:
    name: Publish Documentation
    needs: [create-release, build-docs]
    runs-on: macos-26
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy qualified documentation
      id: deployment
      uses: actions/deploy-pages@v5
