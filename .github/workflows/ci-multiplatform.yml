name: CI (Multiplatform)

# PR and tag qualification share the same compiler, correctness, and platform gates.

on:
  workflow_call:
  push:
    branches: [ 'release/**' ]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  CI: 'true'

jobs:
  macos-spm:
    name: macOS • SwiftPM (Debug + Release)
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: System Info
        run: |
          echo "## System Info" >> $GITHUB_STEP_SUMMARY
          echo "- Swift: $(swift --version | head -1)" >> $GITHUB_STEP_SUMMARY
          echo "- Xcode: $(xcodebuild -version | head -1)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS: $(sw_vers -productVersion)" >> $GITHUB_STEP_SUMMARY

      - name: Cache SPM
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build (Debug)
        run: swift build -c debug

      - name: Validate qualification tooling
        run: bash Scripts/ci/check-qualification-tools.sh

      - name: Test (Debug + Coverage)
        run: |
          python3 Scripts/ci/coverage.py collect \
            --directory "${RUNNER_TEMP}/coverage-multiplatform-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Export coverage
        run: |
          python3 Scripts/ci/coverage.py export \
            --directory "${RUNNER_TEMP}/coverage-multiplatform-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output coverage.lcov

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-macos
          path: coverage.lcov
          if-no-files-found: error

      - name: Numeric and compression validation (Debug)
        run: |
          set -euo pipefail
          validation_root="${RUNNER_TEMP}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 Scripts/validation/check_numeric_boundaries.py --configuration debug \
            --logs "${validation_root}/numeric-debug"
          python3 Scripts/validation/check_compression_formats.py --configuration debug \
            --log "${validation_root}/compression-debug.log"

      - name: Build (Release)
        run: swift build --configuration release --build-tests -Xswiftc -enable-testing

      - name: Test (Release)
        # Benchmarks retain their separate advisory lane; correctness failures are fatal.
        run: python3 Scripts/ci/check-correctness.py --configuration release

      - name: Numeric and compression validation (Release)
        run: |
          set -euo pipefail
          validation_root="${RUNNER_TEMP}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 Scripts/validation/check_numeric_boundaries.py --configuration release \
            --logs "${validation_root}/numeric-release"
          python3 Scripts/validation/check_compression_formats.py --configuration release \
            --log "${validation_root}/compression-release.log"

      - name: Telemetry protocol validation (Debug + Release)
        run: |
          set -euo pipefail
          validation_root="${RUNNER_TEMP}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 -m venv "${validation_root}/telemetry-venv"
          telemetry_python="${validation_root}/telemetry-venv/bin/python"
          "$telemetry_python" -m pip install -r Scripts/validation/telemetry-requirements.txt
          "$telemetry_python" Scripts/ci/tests/test_telemetry_oracle.py
          python3 Scripts/validation/extract_stabilization_examples.py
          for configuration in debug release; do
            swift build --package-path Tests/Integration/Consumer --configuration "$configuration"
            for mode in composition-security routing cache-identity encryption bulkhead \
                        error-contract lifecycle policy-contract qualification metrics \
                        statsd-startup udp-close udp-failure-close; do
              python3 Scripts/validation/run_check.py \
                --id "consumer-${mode}-${configuration}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --timeout 60 -- \
                swift run --package-path Tests/Integration/Consumer --configuration "$configuration" --skip-build Consumer "$mode"
            done
            python3 Scripts/validation/run_check.py \
              --id "consumer-test-support-${configuration}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --timeout 120 -- \
              swift test --package-path Tests/Integration/Consumer --configuration "$configuration" --filter PublicTestPipelineTests
            "$telemetry_python" Scripts/validation/check_telemetry_formats.py \
              --configuration "$configuration" --log "${validation_root}/telemetry-${configuration}.log"
          done

      - name: Removed bulkhead API validation (Debug + Release)
        run: |
          python3 Scripts/validation/check_bulkhead_api.py --configuration debug
          python3 Scripts/validation/check_bulkhead_api.py --configuration release

      - name: Example application qualification (Debug + Release)
        run: |
          set -euo pipefail
          for configuration in debug release; do
            python3 Scripts/validation/check_examples.py --configuration "$configuration"
          done

  ios-sim:
    name: iOS 26 • Simulator Tests
    runs-on: macos-26
    timeout-minutes: 25
    env:
      SCHEME: PipelineKit-Package
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: System Info
        run: |
          echo "## System Info" >> $GITHUB_STEP_SUMMARY
          echo "- Xcode: $(xcodebuild -version | head -1)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS: $(sw_vers -productVersion)" >> $GITHUB_STEP_SUMMARY
          echo "- Available iOS 26+ simulators:" >> $GITHUB_STEP_SUMMARY
          xcrun simctl list devices available | grep -i iphone | grep "26\." | head -5 >> $GITHUB_STEP_SUMMARY || echo "  (listing may be empty)" >> $GITHUB_STEP_SUMMARY

      - name: Find iOS Simulator
        id: find-sim
        run: |
          # Find the latest iOS 26.x iPhone simulator
          DEVICE=$(xcrun simctl list devices available -j | \
            jq -r '.devices | to_entries[] | select(.key | contains("iOS") and contains("26")) | .value[] | select(.name | contains("iPhone")) | .name' | \
            head -1)

          if [ -z "$DEVICE" ]; then
            echo "No iOS 26.x iPhone simulator found, falling back to generic destination"
            echo "destination=platform=iOS Simulator,name=Any iOS Simulator Device" >> $GITHUB_OUTPUT
          else
            echo "Found simulator: $DEVICE"
            echo "destination=platform=iOS Simulator,name=$DEVICE" >> $GITHUB_OUTPUT
          fi

      - name: Build for testing (Debug)
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme "$SCHEME" \
            -destination "${{ steps.find-sim.outputs.destination }}" \
            -configuration Debug \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build-for-testing | xcpretty

      - name: Run tests (Debug)
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme "$SCHEME" \
            -destination "${{ steps.find-sim.outputs.destination }}" \
            -configuration Debug \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            test | xcpretty

  compiler-floor:
    name: Swift 6.2 • Debug and Release Builds
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Select Swift 6.2 SDK toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'
      - name: Compile package and public consumer at the floor
        run: bash Scripts/ci/check-swift-floor.sh

  apple-platform-builds:
    name: ${{ matrix.platform }} • ${{ matrix.configuration }} Simulator Build
    runs-on: macos-26
    timeout-minutes: 20
    continue-on-error: ${{ matrix.platform == 'watchOS' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [watchOS, tvOS, visionOS]
        configuration: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Xcode version
        run: xcodebuild -version

      - name: Build advertised Apple platform
        env:
          DESTINATION: generic/platform=${{ matrix.platform }} Simulator
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          bash Scripts/ci/build-apple-platform.sh "$DESTINATION" "$CONFIGURATION"
