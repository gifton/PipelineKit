blank_issues_enabled: true
contact_links:
  - name: Ask a question or share what you built
    url: https://github.com/gifton/PipelineKit/discussions
    about: Usage questions, design discussion and show-and-tell go in Discussions. Use an issue for a bug or a concrete feature request.
  - name: Report a security vulnerability
    url: https://github.com/gifton/PipelineKit/security/advisories/new
    about: Report vulnerabilities privately through a security advisory, not in a public issue. SECURITY.md describes what to expect.
  - name: Documentation
    url: https://gifton.github.io/PipelineKit/documentation/
    about: API reference for the seven library modules. Guides, tutorials and the upgrade guide are in the repository's docs folder.
